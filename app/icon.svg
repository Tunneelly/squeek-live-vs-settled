<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Live vs Settled">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AD7FF"/>
      <stop offset="0.5" stop-color="#B79CFF"/>
      <stop offset="1" stop-color="#E8A93A"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#15151A" stroke="url(#rim)" stroke-width="1.5"/>
  <g fill="#4FD99B">
    <circle cx="14" cy="14" r="4"/><circle cx="26" cy="14" r="4"/>
    <circle cx="14" cy="26" r="4"/><circle cx="26" cy="26" r="4"/><circle cx="38" cy="26" r="4"/>
    <circle cx="14" cy="38" r="4"/><circle cx="26" cy="38" r="4"/>
    <circle cx="14" cy="50" r="4"/>
  </g>
  <g fill="#E8A93A" filter="url(#glow)">
    <circle cx="38" cy="14" r="4"/>
    <circle cx="50" cy="26" r="4"/>
    <circle cx="38" cy="38" r="4"/>
    <circle cx="26" cy="50" r="4"/>
  </g>
  <g fill="#2A2A32">
    <circle cx="50" cy="14" r="4"/>
    <circle cx="50" cy="38" r="4"/>
    <circle cx="38" cy="50" r="4"/><circle cx="50" cy="50" r="4"/>
  </g>
</svg>